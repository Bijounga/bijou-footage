name: Mac test

# Builds the Mac app on one of GitHub's Macs and runs it for real
# (scripts/mac-smoke.mjs): installs ffmpeg / transcription / AI summaries
# through the app's own Settings → Tools (tiny models, to keep it quick),
# reads + plays a generated recording in Review and Edit, transcribes
# speech made by macOS `say`, and summarizes it. Screenshots and results
# are attached to the run. Nothing is published.
on:
  workflow_dispatch:
  push:
    branches: [mac-port]

jobs:
  mac:
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npx electron-vite build

      - name: Package (Apple Silicon)
        run: npx electron-builder --mac dir --arm64 --publish never

      - name: Check the app's signature
        run: codesign --verify --deep --strict --verbose=2 "dist/mac-arm64/Bijou Footage.app"

      - name: Start the app
        run: |
          mkdir -p "$RUNNER_TEMP/bf"
          BIJOU_FOOTAGE_DATA="$RUNNER_TEMP/bf/data" BIJOU_FOOTAGE_TOOLS="$RUNNER_TEMP/bf/tools" \
          BIJOU_WHISPER_MODEL=tiny BIJOU_SETUP_TEST=1 \
            "dist/mac-arm64/Bijou Footage.app/Contents/MacOS/Bijou Footage" --remote-debugging-port=9223 \
            > "$RUNNER_TEMP/bf/app.log" 2>&1 &

      - name: Smoke test
        run: node scripts/mac-smoke.mjs "$RUNNER_TEMP/bf/out" "$RUNNER_TEMP/bf/work"

      - name: Build the release files (universal .dmg + .zip)
        run: |
          npx electron-builder --mac --universal --publish never
          codesign --verify --deep --strict --verbose=2 "dist/mac-universal/Bijou Footage.app"
          lipo -archs "dist/mac-universal/Bijou Footage.app/Contents/MacOS/Bijou Footage"
          hdiutil verify dist/*.dmg
          ls -la dist/*.dmg dist/*.zip

      - name: Disk image gets ejected when the app starts
        run: |
          pkill -f 'Bijou Footage.app/Contents/MacOS' || true
          hdiutil attach dist/*.dmg
          ls -d /Volumes/Bijou\ Footage*
          "dist/mac-universal/Bijou Footage.app/Contents/MacOS/Bijou Footage" > "$RUNNER_TEMP/bf/dmg-app.log" 2>&1 &
          for i in $(seq 30); do sleep 1; ls -d /Volumes/Bijou\ Footage* > /dev/null 2>&1 || break; done
          pkill -f 'Bijou Footage.app/Contents/MacOS' || true
          if ls -d /Volumes/Bijou\ Footage* 2> /dev/null; then echo "still mounted"; exit 1; fi
          echo "ejected"

      - name: Self-update in /Applications (0.0.1 -> 0.0.2 from a local feed)
        run: |
          npx electron-builder --mac zip --arm64 --publish never -c.extraMetadata.version=0.0.1 -c.directories.output=dist-a
          npx electron-builder --mac zip --arm64 --publish never -c.extraMetadata.version=0.0.2 -c.directories.output=dist-b
          rm -rf "/Applications/Bijou Footage.app"
          ditto -x -k dist-a/*.zip /Applications/
          node scripts/serve-dir.mjs dist-b 8765 > "$RUNNER_TEMP/bf/feed.log" 2>&1 &
          sleep 2
          curl -fsS http://127.0.0.1:8765/latest-mac.yml
          BIJOU_UPDATE_FEED=http://127.0.0.1:8765 BIJOU_FOOTAGE_DATA="$RUNNER_TEMP/bf/data-u" \
            "/Applications/Bijou Footage.app/Contents/MacOS/Bijou Footage" --remote-debugging-port=9223 \
            > "$RUNNER_TEMP/bf/update-app.log" 2>&1 &
          node scripts/mac-update-test.mjs 0.0.2 "$RUNNER_TEMP/bf/out"

      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mac-smoke
          path: |
            ${{ runner.temp }}/bf/out
            ${{ runner.temp }}/bf/*.log
